<script id="engine">
/* ====== PURE ENGINE: lender rules + scoring (no DOM) ====== */
const LENDERS = [
  // ---- Personal loans
  {p:"pl",name:"HDFC Bank",kind:"Bank",emp:["sal"],minAge:21,maxMat:60,minInc:25000,expTotal:24,expCur:12,cibil:720,
   src:"https://www.hdfc.bank.in/personal-loan/eligibility-criteria",note:"Pvt Ltd / PSU employees"},
  {p:"pl",name:"ICICI Bank",kind:"Bank",emp:["sal","self"],
   sal:{minAge:20,maxMat:58,minInc:30000,expTotal:24,cibil:700},
   self:{minAge:23,maxMat:65,vintage:2,minAnnual:200000},
   src:"https://www.icici.bank.in/personal-banking/loans/personal-loan/eligibility",note:"Self-employed: profit after tax ₹2L+"},
  {p:"pl",name:"SBI (Xpress Credit)",kind:"Bank",emp:["sal"],minAge:21,maxMat:58,minInc:25000,needBank:"sbi",employers:["govt","mnc","pvt"],
   src:"https://sbi.co.in/web/personal-banking/loans",note:"Needs SBI salary account; EMI up to 60% of income"},
  {p:"pl",name:"Axis Bank",kind:"Bank",emp:["sal"],minAge:21,maxMat:60,minInc:25000,ownBank:{bank:"axis",inc:15000},expTotal:12,cibil:700,
   src:"https://www.axis.bank.in/loans/personal-loan/personal-loan-for-rs-40000-salary",note:"₹15,000 if salary is in Axis"},
  {p:"pl",name:"Bajaj Finance",kind:"NBFC",emp:["sal"],minAge:21,maxMat:80,minInc:25001,cibil:685,
   src:"https://www.bajajfinserv.in/personal-loan-eligibility-calculator",note:"Income floor varies by city"},
  {p:"pl",name:"Tata Capital",kind:"NBFC",emp:["sal"],minAge:21,maxMat:58,minInc:20000,expTotal:24,expCur:12,cibil:725,
   src:"https://www.tatacapital.com/personal-loan",note:"725+ preferred"},
  {p:"pl",name:"Moneyview",kind:"Fintech",emp:["sal","self"],minAge:21,maxMat:57,minInc:25000,minAnnual:300000,cibil:650,needBankCredit:true,
   src:"https://moneyview.in/personal-loan-eligibility-check",note:"Income must come into a bank account"},
  {p:"pl",name:"KreditBee",kind:"Fintech",emp:["sal"],minAge:21,maxMat:60,minInc:10000,
   src:"https://www.paisabazaar.com/personal-loan/kreditbee/eligibility",note:"Secondary source; small-ticket loans",secondary:true},
  // ---- Business loans
  {p:"bl",name:"HDFC Bank",kind:"Bank",emp:["self"],minAge:21,maxMat:65,turnover:4000000,vintage:3,minAnnual:300000,itrYears:2,
   src:"https://www.hdfc.bank.in/business-loan/eligibility",note:"Profit in last 2 years; 5 yrs total business experience"},
  {p:"bl",name:"ICICI Bank",kind:"Bank",emp:["self"],minAge:21,maxMat:65,vintage:3,
   src:"https://www.icici.bank.in/personal-banking/loans/personal-loan/business-instalment-loan",note:"Other limits set case by case"},
  {p:"bl",name:"Bajaj Finance",kind:"NBFC",emp:["self"],minAge:21,maxMat:80,vintage:3,cibil:650,
   src:"https://www.bajajfinserv.in/business-loan-eligibility-and-documents",note:"₹2 lakh – ₹80 lakh"},
  {p:"bl",name:"Lendingkart",kind:"NBFC",emp:["self"],minAge:18,maxMat:65,vintage:1,turnover:300000,cibil:650,
   src:"https://www.lendingkart.com/faqs/faq-category/productsbusiness-loans-eligibility/",note:"₹75,000 sales in last 3 months"},
  {p:"bl",name:"Tata Capital",kind:"NBFC",emp:["self"],minAge:21,maxMat:65,vintage:2,
   src:"https://www.tatacapital.com/blog/loan-for-business/know-your-business-loan-eligibility-at-your-fingertips/",note:"Stable or rising turnover"},
  // ---- Home loans
  {p:"hl",name:"HDFC Bank",kind:"Bank",emp:["sal","self"],minAge:18,maxMat:70,
   sal:{minInc:10000},self:{minAnnual:200000},
   src:"https://homeloans.hdfc.bank.in/home-loan-eligibility-calculator",note:"Tenure up to 30 years"},
  {p:"hl",name:"SBI",kind:"Bank",emp:["sal","self"],minAge:18,maxMat:70,cibil:650,
   self:{vintage:3},
   src:"https://www.nobroker.in/home-loan/sbi-bank/regular-home-loan",note:"Secondary source; 750+ for best rate",secondary:true},
  {p:"hl",name:"LIC Housing Finance",kind:"HFC",emp:["sal","self"],minAge:21,maxAge:50,maxMat:70,cibil:600,
   src:"https://www.nobroker.in/home-loan/lic-housing-finance",note:"Secondary source; apply by age 50",secondary:true},
  {p:"hl",name:"Bajaj Housing Finance",kind:"HFC",emp:["sal","self"],cibil:725,
   sal:{minAge:23,maxMat:67,expTotal:36},self:{minAge:23,maxMat:70,vintage:3},
   src:"https://www.bajajfinserv.in/home-loan-eligibility-calculator",note:"Up to 32-year tenure"},
  // ---- Loan against property
  {p:"lap",name:"HDFC Bank",kind:"Bank",emp:["sal","self"],minAge:21,maxMat:65,needOwn:true,
   src:"https://homeloans.hdfc.bank.in/non-housing-loans/loan-against-property",note:"Tenure up to 15 years"},
  {p:"lap",name:"ICICI Bank",kind:"Bank",emp:["sal","self"],minAge:25,maxMat:65,needOwn:true,
   src:"https://www.icici.bank.in/personal-banking/loans/home-loan/loan-against-property",note:"Up to 75% of property value"},
  {p:"lap",name:"Bajaj Finance",kind:"NBFC",emp:["sal","self"],minAge:25,maxMat:85,cibil:650,needOwn:true,
   sal:{expTotal:36},self:{vintage:5},
   src:"https://www.bajajfinserv.in/loan-against-property-eligibility-and-documents",note:"700+ ideal"}
];

const PRODUCT = {
  pl:{label:"Personal loan",tenure:5,cap:4000000,rates:{750:11,700:13,650:16,600:20,low:24,unknown:14}},
  bl:{label:"Business loan",tenure:3,cap:8000000,rates:{750:17,700:19,650:21,600:24,low:26,unknown:20}},
  hl:{label:"Home loan",tenure:30,cap:Infinity,rates:{750:8,700:8.5,650:9.25,600:9.75,low:10.5,unknown:8.75}},
  lap:{label:"Loan against property",tenure:15,cap:Infinity,rates:{750:9.5,700:10.5,650:11.5,600:12.5,low:14,unknown:11}}
};
const CIBIL_RANGE = {750:[750,900],700:[700,749],650:[650,699],600:[600,649],low:[300,599],unknown:null};
const CIBIL_LABEL = {750:"750+",700:"700–749",650:"650–699",600:"600–649",low:"Below 600",unknown:"Unknown"};

function rulesFor(L, emp){ return Object.assign({}, L, L[emp]||{}); }

function monthlyIncome(p){ return p.emp==="sal" ? (p.income||0) : (p.profit||0)/12; }

function foirLimit(inc){ return inc<=25000?0.40: inc<=50000?0.50: inc<=100000?0.55:0.60; }

function emiFor(P, ratePct, years){
  if(!(P>0)) return 0;
  const r = ratePct/1200, n = Math.round(years*12);
  return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
}
function principalFor(emi, ratePct, years){
  if(!(emi>0)) return 0;
  const r = ratePct/1200, n = Math.round(years*12);
  return emi*(1-Math.pow(1+r,-n))/r;
}
function tenureYears(p){
  const prod = PRODUCT[p.product];
  const endAge = p.emp==="sal"?65:70;
  let t = Math.min(prod.tenure, endAge - p.age);
  return Math.max(1, t);
}
function hlLtvCap(v){
  if(!(v>0)) return 0;
  const c1 = Math.min(0.9*v, 3000000);
  const c2 = 0.8*v>3000000 ? Math.min(0.8*v, 7500000) : 0;
  const c3 = 0.75*v>7500000 ? 0.75*v : 0;
  return Math.max(c1,c2,c3);
}

/* Check one lender. Returns {status:"yes"|"likely"|"no", reasons:[...]} */
function checkLender(L, p){
  const R = rulesFor(L, p.emp);
  const fails = [], soft = [];
  if(!R.emp.includes(p.emp)) fails.push(p.emp==="sal"?"Only for self-employed":"Only for salaried");
  if(R.minAge && p.age < R.minAge) fails.push("Minimum age "+R.minAge);
  if(R.maxAge && p.age > R.maxAge) fails.push("Must apply by age "+R.maxAge);
  if(R.maxMat && R.maxMat - p.age < 1) fails.push("Loan must end by age "+R.maxMat);
  if(p.emp==="sal"){
    const inc = p.income||0;
    let need = R.minInc;
    if(R.ownBank && p.salBank===R.ownBank.bank) need = R.ownBank.inc;
    if(need && inc < need) fails.push("Salary below ₹"+need.toLocaleString("en-IN"));
    if(R.needBank && p.salBank!==R.needBank) fails.push("Needs salary account with "+R.needBank.toUpperCase());
    if(R.employers && !R.employers.includes(p.employer)) fails.push("Employer type not covered");
    if(R.expTotal && (p.expTotal||0)*12 < R.expTotal) fails.push((R.expTotal/12)+"+ yrs total experience");
    if(R.expCur && (p.expCur||0) < R.expCur) fails.push(R.expCur+"+ months in current job");
    if((R.needBankCredit) && p.salBank==="cash") fails.push("Salary must come into a bank");
    if(p.salBank==="cash" && !R.needBankCredit) soft.push("Cash salary is hard to prove");
  } else {
    if(R.minAnnual && (p.profit||0) < R.minAnnual) fails.push("ITR income below ₹"+R.minAnnual.toLocaleString("en-IN"));
    if(R.turnover && (p.turnover||0) < R.turnover) fails.push("Turnover below ₹"+R.turnover.toLocaleString("en-IN"));
    if(R.vintage && (p.vintage||0) < R.vintage) fails.push("Business must be "+R.vintage+"+ yrs old");
    if(R.itrYears && (p.itrYears||0) < R.itrYears) fails.push(R.itrYears+" years of ITR");
  }
  if(R.needOwn && p.ownName==="no") fails.push("Property must be in your name");
  if(R.cibil){
    const rg = CIBIL_RANGE[p.cibil];
    if(!rg) soft.push("CIBIL "+R.cibil+"+ needed");
    else if(rg[1] < R.cibil) fails.push("CIBIL "+R.cibil+"+ needed");
    else if(rg[0] < R.cibil) soft.push("CIBIL may be just under "+R.cibil);
  }
  if(p.settled==="yes") fails.push("Past settlement / write-off");
  const status = fails.length ? "no" : (soft.length ? "likely" : "yes");
  return {status, reasons: fails.length?fails:soft};
}

/* Rank matched lenders to decide where to log in the file first. */
const OWN_BANK = {hdfc:"HDFC Bank",icici:"ICICI Bank",sbi:"SBI",axis:"Axis Bank"};
const KIND_WHY = {Bank:"lowest interest rate",HFC:"home-loan specialist",NBFC:"faster approval, more flexible on CIBIL",Fintech:"quick small loan, but high interest"};
function suggestLogin(p, matches){
  const good = ["750","700"].includes(String(p.cibil)) && p.bounces==0;
  const base = good ? {Bank:40,HFC:36,NBFC:28,Fintech:8} : {Bank:12,HFC:22,NBFC:36,Fintech:28};
  const own = p.emp==="sal" ? OWN_BANK[p.salBank] : null;
  return matches.map(m=>{
    let s = base[m.L.kind]||10; const why = [KIND_WHY[m.L.kind]];
    if(m.status==="yes") s += 20; else { s += 8; why.push("confirm CIBIL first"); }
    if(own && m.L.name.startsWith(own)){ s += 30; why.unshift("salary account here"); }
    return {name:m.L.name, kind:m.L.kind, s, why:why.join(", ")};
  }).sort((a,b)=>b.s-a.s).slice(0,2);
}

function evaluate(p){
  const prod = PRODUCT[p.product];
  const lenders = LENDERS.filter(L=>L.p===p.product);
  const results = lenders.map(L=>({L, ...checkLender(L,p)}));
  const matches = results.filter(r=>r.status!=="no");
  const inc = monthlyIncome(p);
  const rate = prod.rates[p.cibil];
  const years = tenureYears(p);
  const foir = foirLimit(inc);
  const room = Math.max(0, inc*foir - (p.emi||0));
  let max = principalFor(room, rate, years);
  max = Math.min(max, prod.cap);
  if(p.product==="hl") max = Math.min(max, hlLtvCap(p.propValue||0));
  if(p.product==="lap") max = Math.min(max, (p.propValue||0)*(p.propType==="com"?0.5:0.6));
  if(p.product==="bl") max = Math.min(max, 0.2*(p.turnover||0));
  if(!matches.length) max = 0;
  max = Math.max(0, Math.floor(max/10000)*10000);
  const askEmi = emiFor(p.amount||0, rate, years);
  const ratio = inc>0 ? ((p.emi||0)+askEmi)/inc : 9;

  // ---- score
  const parts = {};
  parts.cibil = {750:35,700:28,650:18,600:8,low:0,unknown:15}[p.cibil];
  parts.emi = ratio<=0.40?25: ratio<=0.50?20: ratio<=0.60?12: ratio<=0.70?5:0;
  parts.bounce = {0:15,1:8,2:0}[p.bounces];
  if(p.emp==="sal"){
    const cur=p.expCur||0, tot=(p.expTotal||0)*12;
    parts.stab = (cur>=12&&tot>=24)?15: cur>=6?10:3;
    parts.prof = {govt:10,mnc:9,pvt:7,other:4}[p.employer] - (p.salBank==="cash"?4:0);
  } else {
    const v=p.vintage||0;
    parts.stab = v>=3?15: v>=2?10: v>=1?6:2;
    parts.prof = {2:10,1:6,0:0}[p.itrYears] + (p.gst==="no"?-2:0);
  }
  let score = Object.values(parts).reduce((a,b)=>a+b,0);
  if((p.amount||0) > max && max>0) score -= 10;
  if(p.settled==="yes") score = Math.min(score,35);
  score = Math.max(0, Math.min(100, Math.round(score)));
  let band = score>=75?"Strong": score>=55?"Good":"Needs work";
  // Strong needs a known good CIBIL, a clean record and the asked amount within limit
  if(band==="Strong" && (!["750","700"].includes(String(p.cibil)) || p.bounces>0 || (p.amount||0)>max)){ band="Good"; score=Math.min(score,74); }
  if(!matches.length){ band = "Needs work"; score = Math.min(score,40); }
  const tier = band==="Strong"?"hot": band==="Good"?"warm":"cold";

  // ---- factor checklist (C-E-B-I-S)
  const checks = [];
  const cb = p.cibil;
  checks.push({lvl: cb==="750"||cb==="700"?"ok": cb==="650"||cb==="unknown"?"mid":"no",
    txt:"CIBIL score: "+CIBIL_LABEL[cb]});
  checks.push({lvl: ratio<=0.5?"ok": ratio<=0.65?"mid":"no",
    txt:"EMIs would take "+Math.round(Math.min(ratio,9)*100)+"% of income"+(p.amount?" (with the new loan)":"")});
  checks.push({lvl: p.bounces==0?"ok": p.bounces==1?"mid":"no",
    txt: p.bounces==0?"No EMI bounces in last 12 months": p.bounces==1?"1 bounce in last 12 months":"2 or more recent bounces"});
  checks.push({lvl: parts.prof>=7?"ok": parts.prof>=4?"mid":"no",
    txt: p.emp==="sal" ? (p.salBank==="cash"?"Salary paid in cash":"Salary credited to bank") : (p.itrYears==2?"ITR filed 2+ years": p.itrYears==1?"ITR filed 1 year":"No ITR filed")});
  checks.push({lvl: parts.stab>=15?"ok": parts.stab>=10?"mid":"no",
    txt: p.emp==="sal" ? ((p.expCur||0)+" months in current job") : ((p.vintage||0)+" years in business")});
  if(p.settled==="yes") checks.push({lvl:"no",txt:"Past settlement or write-off on record"});

  // ---- tips
  const tips = [];
  if(cb==="low"||cb==="600") tips.push("Raise your CIBIL score above 700 first: pay every EMI and card bill on time for 6 months.");
  if(cb==="unknown") tips.push("Check your CIBIL score for free before applying. Lenders decide on it.");
  if(ratio>0.6) tips.push("Your EMIs would be too high for your income. Ask for a smaller amount, a longer tenure, or close a small loan first.");
  if(p.bounces>0) tips.push("Avoid any more bounces. Most lenders check the last 6–12 months of bank statements.");
  if(p.emp==="sal" && (p.expCur||0)<12) tips.push("Many banks want 12 months in your current job. NBFCs and apps are more flexible.");
  if(p.emp==="self" && p.itrYears<2) tips.push("File ITR every year. Most banks want 2 years of returns.");
  if(p.emp==="self" && (p.vintage||0)<3) tips.push("Banks usually want a 3-year-old business. Lendingkart-type NBFCs accept 1 year.");
  if(p.settled==="yes") tips.push("A settled loan stays on your report. Paying the full balance and getting a 'closed' status helps.");
  if((p.amount||0)>max && max>0) tips.push("You asked for more than your estimated limit. Adding an earning co-applicant can raise it.");
  if(p.product==="lap" && p.ownName==="no") tips.push("For LAP the property owner must be an applicant. Apply together with the owner.");

  const login = suggestLogin(p, matches);
  return {results, matches, max, askEmi, rate, years, foir, score, band, tier, checks, tips, parts, inc, login};
}

tip_cibil_low:"CIBIL ಸ್ಕೋರ್ ಹೆಚ್ಚಿಸಲು 6 ತಿಂಗಳು ಪ್ರತಿ EMI ಮತ್ತು ಕ್ರೆಡಿಟ್ ಕಾರ್ಡ್ ಬಿಲ್ ಸಮಯಕ್ಕೆ ಕಟ್ಟಿ.",tip_cibil_unknown:"ಅರ್ಜಿ ಹಾಕುವ ಮೊದಲು ನಿಮ್ಮ CIBIL ಸ್ಕೋರ್ ಉಚಿತವಾಗಿ ನೋಡಿ.",tip_emi_high:"ನಿಮ್ಮ ಆದಾಯಕ್ಕೆ EMI ಹೆಚ್ಚಾಗಿದೆ. ಕಡಿಮೆ ಲೋನ್ ಕೇಳಿ ಅಥವಾ ಮೊದಲು ಒಂದು ಸಣ್ಣ ಲೋನ್ ಮುಗಿಸಿ.",tip_missed:"ಇನ್ನು ಯಾವುದೇ EMI ತಪ್ಪಿಸಬೇಡಿ. ಬ್ಯಾಂಕ್‌ಗಳು ಕಳೆದ 6-12 ತಿಂಗಳು ನೋಡುತ್ತವೆ.",tip_job_new:"ಹಲವು ಬ್ಯಾಂಕ್‌ಗಳು ಈಗಿನ ಉದ್ಯೋಗದಲ್ಲಿ ಕನಿಷ್ಠ 1 ವರ್ಷ ಇರಬೇಕು ಎನ್ನುತ್ತವೆ.",tip_itr:"ಪ್ರತಿ ವರ್ಷ ITR ಸಲ್ಲಿಸಿ. ಬ್ಯಾಂಕ್‌ಗಳು 2 ವರ್ಷದ ITR ಕೇಳುತ್ತವೆ.",tip_bizage:"ಬ್ಯಾಂಕ್‌ಗಳು ಸಾಮಾನ್ಯವಾಗಿ 3 ವರ್ಷ ಹಳೆಯ ವ್ಯಾಪಾರ ಕೇಳುತ್ತವೆ. ಕೆಲವು ಫೈನಾನ್ಸ್ ಕಂಪನಿಗಳು 1 ವರ್ಷದ ವ್ಯಾಪಾರಕ್ಕೂ ಕೊಡುತ್ತವೆ.",tip_settled:"ಸೆಟಲ್ ಮಾಡಿದ ಲೋನ್ ನಿಮ್ಮ ದಾಖಲೆಯಲ್ಲಿ ಉಳಿಯುತ್ತದೆ. ಪೂರ್ತಿ ಹಣ ಕಟ್ಟಿ ಅದನ್ನು 'ಕ್ಲೋಸ್ಡ್' ಮಾಡಿಸಿದರೆ ಸಹಾಯವಾಗುತ್ತದೆ.",tip_amount:"ನಿಮ್ಮ ಮಿತಿಗಿಂತ ಹೆಚ್ಚು ಲೋನ್ ಕೇಳಿದ್ದೀರಿ. ಸಂಪಾದಿಸುವ ಕುಟುಂಬದ ಸದಸ್ಯರನ್ನು ಸೇರಿಸಿದರೆ ಸಹಾಯವಾಗಬಹುದು.",tip_cash:"ಸಂಬಳವನ್ನು ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ ಪಡೆಯಿರಿ. ಬ್ಯಾಂಕ್‌ಗಳಿಗೆ ಸಂಬಳದ ಪುರಾವೆ ಬೇಕು.",tip_lap_owner:"ಆಸ್ತಿಯ ಮಾಲೀಕರೂ ಈ ಲೋನ್‌ಗೆ ಜೊತೆಯಾಗಿ ಅರ್ಜಿ ಹಾಕಬೇಕು.",
call_yes:"ನಮ್ಮ ಸಲಹೆಗಾರರು ಶೀಘ್ರದಲ್ಲೇ ನಿಮಗೆ ಕರೆ ಮಾಡುತ್ತಾರೆ. ಸ್ಪ್ಯಾಮ್ ಇಲ್ಲ, ಒಂದೇ ಕರೆ.",call_no:"ನೀವು ಕರೆ ಬೇಡ ಎಂದಿದ್ದೀರಿ. ನಂತರ ಸಹಾಯ ಬೇಕಾದರೆ ಮತ್ತೆ ಚೆಕ್ ಮಾಡಿ ಕರೆಗೆ ಅನುಮತಿ ನೀಡಿ.",again:"ಮತ್ತೆ ಚೆಕ್ ಮಾಡಿ",
disclaimer:"ಇದು ಬ್ಯಾಂಕ್‌ಗಳ ಸಾರ್ವಜನಿಕ ನಿಯಮಗಳ ಆಧಾರದ ಅಂದಾಜು ಮಾತ್ರ. ಅಂತಿಮ ನಿರ್ಧಾರ ಯಾವಾಗಲೂ ಬ್ಯಾಂಕ್‌ನದು. LoanCheckBLR ಬ್ಯಾಂಕ್ ಅಲ್ಲ.",sending:"ದಯವಿಟ್ಟು ಕಾಯಿರಿ…",
m_upto:"{x} ವರೆಗೆ",m_above:"{x} ಕ್ಕಿಂತ ಹೆಚ್ಚು",lakh:"ಲಕ್ಷ",crore:"ಕೋಟಿ"}
};
</script>
<script>
/* ===== settings: paste your Google Apps Script web-app URL here ===== */
const LEAD_URL = "https://script.google.com/macros/s/AKfycbyNNCTZwn51vEz7cGDy9rEu8qN2dvJB5q7NStXeen8HHryCQ4K40ZbRjzFj1DGeN8KC/exec";

/* ===== language ===== */
const LANGS = ["en","hi","bn","mr","te","ta","kn"];
let lang = "en";
try{ const s = localStorage.getItem("lc_lang"); if(LANGS.includes(s)) lang = s; else { const n=(navigator.language||"").slice(0,2); if(LANGS.includes(n)) lang = n; } }catch(e){}
const T = k => (I18N[lang][k] ?? I18N.en[k]);
const fill = (s,o) => s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function money(n){
  if(n>=1e7) return "₹"+(+(n/1e7).toFixed(2))+" "+T("crore");
  if(n>=1e5) return "₹"+(+(n/1e5).toFixed(2))+" "+T("lakh");
  return "₹"+Math.round(n).toLocaleString("en-IN");
}
function rangeLabel([a,b]){
  if(a==null) return fill(T("m_upto"),{x:money(b)});
  if(b==null) return fill(T("m_above"),{x:money(a)});
  return money(a)+" – "+money(b);
}

/* ===== answer options (label source, value) ===== */
const R = {
  income:[[null,15000,12000],[15000,25000,20000],[25000,40000,32000],[40000,60000,50000],[60000,100000,80000],[100000,200000,150000],[200000,null,250000]],
  turnover:[[null,1000000,500000],[1000000,2500000,1700000],[2500000,5000000,3700000],[5000000,10000000,7500000],[10000000,null,15000000]],
  emi:[[null,5000,3000],[5000,15000,10000],[15000,30000,22000],[30000,null,40000]],
  prop:[[null,2500000,2000000],[2500000,5000000,3700000],[5000000,10000000,7500000],[10000000,20000000,15000000],[20000000,null,25000000]],
  amount:{
    pl:[[null,100000,100000],[100000,300000,200000],[300000,500000,400000],[500000,1000000,750000],[1000000,null,1500000]],
    bl:[[null,500000,300000],[500000,1000000,750000],[1000000,2500000,1700000],[2500000,5000000,3700000],[5000000,null,6000000]],
    hl:[[null,2500000,2000000],[2500000,5000000,3700000],[5000000,10000000,7500000],[10000000,null,12000000]],
    lap:[[null,1000000,700000],[1000000,2500000,1700000],[2500000,5000000,3700000],[5000000,null,7000000]]
  }
};
const AGES = [["18–25",22],["26–35",30],["36–45",40],["46–55",50],["56–65",60],["65+",68]];

/* ===== questions: each returns {key, title, options:[{label,sub,icon,value}]} ===== */
const ans = {};
function questions(){
  const q = [];
  q.push({key:"product",title:T("q_product"),opts:[
    {icon:"👤",label:T("pl"),sub:T("pl_d"),value:"pl"},
    {icon:"🏪",label:T("bl"),sub:T("bl_d"),value:"bl"},
    {icon:"🏠",label:T("hl"),sub:T("hl_d"),value:"hl"},
    {icon:"📄",label:T("lap"),sub:T("lap_d"),value:"lap"}]});
  if(ans.product!=="bl") q.push({key:"emp",title:T("q_emp"),opts:[{icon:"💼",label:T("sal"),value:"sal"},{icon:"🏪",label:T("self"),value:"self"}]});
  const emp = ans.product==="bl" ? "self" : ans.emp;
  q.push({key:"age",title:T("q_age"),opts:AGES.map(([l,v])=>({label:fill(T("years"),{x:l}),value:v}))});
  q.push({key:"income",title:emp==="self"?T("q_income_self"):T("q_income_sal"),opts:R.income.map(r=>({label:rangeLabel(r),value:r[2]}))});
  if(emp==="self"){
    if(ans.product==="bl") q.push({key:"turnover",title:T("q_turnover"),opts:R.turnover.map(r=>({label:rangeLabel(r),value:r[2]}))});
    q.push({key:"bizage",title:T("q_bizage"),opts:T("bizage").map((l,i)=>({label:l,value:[0.5,1.5,2.5,4,6][i]}))});
    q.push({key:"itr",title:T("q_itr"),opts:T("itr").map((l,i)=>({label:l,value:[2,1,0][i]}))});
  } else {
    q.push({key:"jobtime",title:T("q_jobtime"),opts:T("jobtime").map((l,i)=>({label:l,value:[3,9,18,36][i]}))});
    q.push({key:"salmode",title:T("q_salmode"),opts:[{icon:"🏦",label:T("salmode")[0],value:"bank"},{icon:"💵",label:T("salmode")[1],value:"cash"}]});
  }
  q.push({key:"emi",title:T("q_emi"),opts:[{label:T("noEmi"),value:0}].concat(R.emi.map(r=>({label:rangeLabel(r),value:r[2]})))});
  q.push({key:"cibil",title:T("q_cibil"),hint:T("cibil_hint"),opts:T("cibil").map((l,i)=>({label:l,value:["750","700","650","low","unknown"][i]}))});
  q.push({key:"missed",title:T("q_missed"),opts:T("missed").map((l,i)=>({label:l,value:i}))});
  q.push({key:"settled",title:T("q_settled"),opts:[{label:T("yesno")[1],value:"no"},{label:T("yesno")[0],value:"yes"}]});
  if(ans.product==="hl"||ans.product==="lap") q.push({key:"propValue",title:T("q_propval"),opts:R.prop.map(r=>({label:rangeLabel(r),value:r[2]}))});
  if(ans.product==="lap"){
    q.push({key:"propType",title:T("q_proptype"),opts:[{icon:"🏠",label:T("proptype")[0],value:"res"},{icon:"🏬",label:T("proptype")[1],value:"com"}]});
    q.push({key:"ownName",title:T("q_propown"),opts:[{label:T("yesno")[0],value:"yes"},{label:T("yesno")[1],value:"no"}]});
  }
  q.push({key:"amount",title:T("q_amount"),opts:(R.amount[ans.product]||R.amount.pl).map(r=>({label:rangeLabel(r),value:r[2]}))});
  q.push({key:"_contact"});
  return q;
}

/* ===== engine input ===== */
function profile(){
  const emp = ans.product==="bl" ? "self" : ans.emp;
  const p = {product:ans.product, emp, age:ans.age, emi:ans.emi||0, city:"Bengaluru",
    income: emp==="sal" ? ans.income : 0, salBank: ans.salmode==="cash"?"cash":"other", employer:"pvt",
    expCur: ans.jobtime||0, expTotal:(ans.jobtime||0)/12,
    profit: emp==="self" ? ans.income*12 : 0, turnover: ans.turnover||0, vintage: ans.bizage||0, itrYears: ans.itr ?? 0, gst:"yes",
    propValue: ans.propValue||0, propType: ans.propType||"res", ownName: ans.ownName||"yes",
    cibil: ans.cibil, bounces: ans.missed||0, settled: ans.settled||"no", amount: ans.amount};
  return p;
}
function tipKeys(p,r){
  const t = [];
  const ratio = r.inc>0 ? ((p.emi||0)+r.askEmi)/r.inc : 9;
  if(p.cibil==="low") t.push("tip_cibil_low");
  if(p.cibil==="unknown") t.push("tip_cibil_unknown");
  if(ratio>0.6) t.push("tip_emi_high");
  if(p.bounces>0) t.push("tip_missed");
  if(p.settled==="yes") t.push("tip_settled");
  if(p.emp==="sal" && p.salBank==="cash") t.push("tip_cash");
  if(p.emp==="sal" && p.expCur<12) t.push("tip_job_new");
  if(p.emp==="self" && p.itrYears<2) t.push("tip_itr");
  if(p.emp==="self" && p.vintage<3) t.push("tip_bizage");
  if(p.product==="lap" && p.ownName==="no") t.push("tip_lap_owner");
  if(p.amount>r.max && r.max>0) t.push("tip_amount");
  return t.slice(0,4);
}

/* ===== rendering ===== */
let step = 0, contact = {name:"",phone:"",nocall:false,agree:false}, result = null;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function setLang(l){
  lang = l; try{ localStorage.setItem("lc_lang", l); }catch(e){}
  document.documentElement.lang = l;
  document.getElementById("langLabel").textContent = T("langLabel");
  document.getElementById("privLink").textContent = T("privacy");
  document.getElementById("foot").textContent = T("disclaimer");
  render();
}
function render(){
  if(result) return renderResult();
  if(step<0) return renderStart();
  const qs = questions();
  if(step>=qs.length) step = qs.length-1;
  const q = qs[step];
  const prog = `<div class="prog"><div class="bar"><i style="width:${Math.round((step+1)*100/qs.length)}%"></i></div><div class="lbl">${fill(T("step"),{n:step+1,t:qs.length})}</div></div>`;
  const back = `<button class="backbtn" id="backBtn" type="button">← ${T("back")}</button>`;
  if(q.key==="_contact") return renderContact(prog, back);
  app.innerHTML = `${back}${prog}<h2 id="qt">${esc(q.title)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
    <div class="opts" role="group" aria-labelledby="qt">${q.opts.map((o,i)=>`<button type="button" class="opt${ans[q.key]===o.value?" sel":""}" data-i="${i}">${o.icon?`<span class="ic" aria-hidden="true">${o.icon}</span>`:""}<span>${esc(o.label)}${o.sub?`<small>${esc(o.sub)}</small>`:""}</span></button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const o = q.opts[+b.dataset.i];
    ans[q.key] = o.value;
    if(q.key==="product"){ delete ans.amount; if(o.value==="bl") ans.emp="self"; }
    step++; render(); app.scrollIntoView({block:"start"});
  }));
  document.getElementById("backBtn").addEventListener("click",()=>{ step--; render(); });
  const first = app.querySelector(".opt.sel") || app.querySelector(".opt"); if(first && step>0) first.focus({preventScroll:true});
}
function renderStart(){
  app.innerHTML = `<h1>${esc(T("tagline"))}</h1>
    <ul class="trust"><li><span>✓</span>${esc(T("free"))}</li><li><span>✓</span>${esc(T("noCibil"))}</li><li><span>✓</span>${esc(T("oneMin"))}</li></ul>
    <button type="button" class="big" id="startBtn">${esc(T("start"))} →</button>`;
  document.getElementById("startBtn").addEventListener("click",()=>{ step=0; render(); });
}
function renderContact(prog, back){
  app.innerHTML = `${back}${prog}<h2>${esc(T("contact_title"))}</h2>
    <form id="cf" novalidate style="display:grid;gap:14px">
      <label class="f" for="cName">${esc(T("name"))}<input type="text" id="cName" autocomplete="name" value="${esc(contact.name)}" maxlength="60"></label>
      <label class="f" for="cPhone">${esc(T("phone"))}<input type="tel" id="cPhone" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98XXXXXXXX" value="${esc(contact.phone)}"></label>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <p class="notice">${esc(T("notice"))} <a href="privacy.html" target="_blank" rel="noopener">${esc(T("privacy"))}</a></p>
      <label class="check" for="cNocall"><input type="checkbox" id="cNocall" ${contact.nocall?"checked":""}><span>${esc(T("nocall"))}</span></label>
      <label class="check" for="cAgree"><input type="checkbox" id="cAgree" ${contact.agree?"checked":""}><span><strong>${esc(T("agree"))}</strong></span></label>
      <p class="err" id="cErr" role="alert"></p>
      <button type="submit" class="big" id="goBtn">${esc(T("showResult"))} →</button>
    </form>`;
  const ph = document.getElementById("cPhone");
  ph.addEventListener("input",()=>{ ph.value = ph.value.replace(/\D/g,"").slice(0,10); });
  document.getElementById("backBtn").addEventListener("click",()=>{ saveContact(); step--; render(); });
  document.getElementById("cf").addEventListener("submit", submit);
}
function saveContact(){
  contact.name = document.getElementById("cName").value.trim();
  contact.phone = document.getElementById("cPhone").value.trim();
  contact.nocall = document.getElementById("cNocall").checked;
  contact.agree = document.getElementById("cAgree").checked;
}
async function submit(e){
  e.preventDefault(); saveContact();
  const err = document.getElementById("cErr");
  if(contact.name.length<2){ err.textContent=T("err_name"); document.getElementById("cName").focus(); return; }
  if(!/^[6-9]\d{9}$/.test(contact.phone)){ err.textContent=T("err_phone"); document.getElementById("cPhone").focus(); return; }
  if(!contact.agree){ err.textContent=T("err_agree"); return; }
  err.textContent = "";
  const btn = document.getElementById("goBtn"); btn.disabled = true; btn.textContent = T("sending");
  const p = profile(); const r = evaluate(p);
  if(!document.getElementById("website").value) await sendLead(p, r);
  result = {p, r}; render(); window.scrollTo(0,0);
}
async function sendLead(p, r){
  if(!LEAD_URL) return;
  const rec = {name:contact.name, phone:contact.phone, callOk: contact.nocall?"No":"Yes", lang,
    product:p.product, emp:p.emp, age:p.age, income:Math.round(r.inc), turnover:p.turnover||"", emi:p.emi, cibil:p.cibil,
    missed:p.bounces, settled:p.settled, propValue:p.propValue||"", propType:(p.product==="lap"?p.propType:""), ownName:(p.product==="lap"?p.ownName:""),
    amount:p.amount, score:r.score, tier:r.tier, maxEstimate:r.max,
    login1:r.login[0]?r.login[0].name:"", login2:r.login[1]?r.login[1].name:"", matches:r.matches.map(m=>m.L.name).join(", "),
    consent:"Agreed to notice v1: save details, one advisor call"+(contact.nocall?" declined":"")+", share with bank/agent only if customer wants to apply"};
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 5000);
    await fetch(LEAD_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec),signal:ctl.signal});
    clearTimeout(t);
  }catch(e){ /* the result is still shown */ }
}
function renderResult(){
  const {p,r} = result;
  const cls = r.band==="Strong"?"strong": r.band==="Good"?"good":"weak";
  const icon = cls==="strong"?"✓": cls==="good"?"!":"✕";
  const head = !r.matches.length ? T("res_none") : cls==="strong"?T("res_strong"): cls==="good"?T("res_good"):T("res_weak");
  const tips = tipKeys(p,r);
  const emiAtMax = emiFor(Math.min(p.amount, r.max||p.amount), r.rate, r.years);
  app.innerHTML = `<div class="verdict"><div class="badge ${cls}" aria-hidden="true">${icon}</div><h2>${esc(head)}</h2></div>
    ${r.max>0?`<div class="amt"><div class="k">${esc(T("upto"))}</div><div class="v">${money(r.max)}</div>
      <div class="s">${esc(fill(T("emi_line"),{emi:money(emiAtMax),yrs:r.years}))}</div></div>`:""}
    <p class="hint">${esc(fill(T("lenders_line"),{m:r.matches.length,t:r.results.length}))}</p>
    ${tips.length?`<div class="tips"><h3>${esc(T("tips_title"))}</h3><ul>${tips.map(k=>`<li>${esc(T(k))}</li>`).join("")}</ul></div>`:""}
    <div class="callnote">${esc(contact.nocall?T("call_no"):T("call_yes"))}</div>
    <button type="button" class="big" id="againBtn">${esc(T("again"))}</button>`;
  document.getElementById("againBtn").addEventListener("click",()=>{ result=null; Object.keys(ans).forEach(k=>delete ans[k]); step=0; render(); });
}

/* ===== boot ===== */
const sel = document.getElementById("langSel");
sel.innerHTML = LANGS.map(l=>`<option value="${l}">${I18N[l]._name}</option>`).join("");
sel.value = lang;
sel.addEventListener("change",()=>setLang(sel.value));
document.getElementById("home").addEventListener("click",e=>{ e.preventDefault(); result=null; step=-1; render(); });
if(LEAD_URL){ document.getElementById("adminLink").href = LEAD_URL; document.getElementById("adminWrap").classList.remove("hide"); }
step = -1;
setLang(lang);
</script>
</body>
</html>
